name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install
          for i in 1 2 3 4 5; do
            npx electron --version && exit 0
            echo "electron binary missing, retry $i"
            rm -rf node_modules/electron/dist "$HOME/Library/Caches/electron"
            sleep $((i * 5))
          done
          exit 1

      - name: Test
        run: npm test

      - name: Smoke test
        run: |
          for i in 1 2 3; do
            npx electron . --smoke && exit 0
            echo "smoke failed, retry $i"
            sleep $((i * 5))
          done
          exit 1

      - name: Build dmg
        run: |
          for i in 1 2 3 4 5; do
            npx electron-builder --mac dmg --arm64 --x64 --publish never && exit 0
            echo "dmg build failed, retry $i"
            rm -rf "$HOME/Library/Caches/electron" "$HOME/Library/Caches/electron-builder"
            sleep $((i * 8))
          done
          exit 1

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Build nsis
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npx electron-builder --win nsis --x64 --publish never && exit 0
            echo "nsis build failed, retry $i"
            sleep $((i * 8))
          done
          exit 1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Build AppImage
        run: |
          for i in 1 2 3 4; do
            npx electron-builder --linux AppImage --x64 --publish never && exit 0
            echo "appimage build failed, retry $i"
            rm -rf "$HOME/.cache/electron" "$HOME/.cache/electron-builder"
            sleep $((i * 8))
          done
          exit 1

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  release:
    needs: [mac, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
